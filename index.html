<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>FutbolX 24/7 Player</title>
  <link rel="stylesheet" href="/assets/player.css?v=1">
  <script defer src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  <script defer src="/assets/player.js?v=1"></script>
</head>
<body>
  <main class="player-shell" id="playerShell">
    <video id="video" playsinline autoplay></video>
    <div class="fx-controls" id="controls" aria-label="Video controls">
      <button class="fx-button" id="playPause" type="button" aria-label="Play" title="Play/Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M8 5v14l11-7z"/></svg></button>
      <button class="fx-button" id="mute" type="button" aria-label="Mute" title="Mute/Unmute"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="volumeIcon" d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14.5 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg></button>
      <input id="volume" class="fx-volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <span class="fx-spacer"></span>
      <button class="fx-button optional-control" id="pip" type="button" aria-label="Picture in picture" title="Picture in picture"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 7h-8v6h8V7zm2-4H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H3V5h18v14z"/></svg></button>
      <button class="fx-button optional-control" id="airplay" type="button" aria-label="AirPlay" title="AirPlay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12a2 2 0 0 1 2 2v8h-2V5H6v8H4V5a2 2 0 0 1 2-2zm6 11 7 8H5l7-8z"/></svg></button>
      <button class="fx-button" id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 4v-4h2v6h-6v-2h4z"/></svg></button>
    </div>
    <div class="fx-message" id="message" role="status" aria-live="polite" hidden></div>
    <button class="fx-start" id="startButton" type="button" hidden>Tap to play</button>
  </main>
</body>
</html>
